name: Benchmark

on:
  workflow_dispatch: # Manual trigger for the final static display snapshot

permissions:
  contents: write

concurrency:
  group: benchmark
  cancel-in-progress: false

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      models: ${{ steps.read.outputs.models }}
    steps:
      - uses: actions/checkout@v4
      - name: Read models from config
        id: read
        run: |
          jq -e 'type == "array" and length > 0 and all(.[]; type == "string" and test("^claude-(haiku|sonnet|opus)-[0-9][a-z0-9-]*$")) and (unique | length) == length' models.json > /dev/null
          echo "models=$(jq -c . models.json)" >> "$GITHUB_OUTPUT"

  eval:
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        model: ${{ fromJson(needs.matrix.outputs.models) }}

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Authenticate Claude Code
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          mkdir -p ~/.claude
          echo '{"hasCompletedOnboarding":true}' > ~/.claude.json
          uv run python -c "
          import json, os, time
          path = os.path.expanduser('~/.claude/.credentials.json')
          creds = {'claudeAiOauth': {
              'accessToken': os.environ['CLAUDE_CODE_OAUTH_TOKEN'],
              'expiresAt': int(time.time() * 1000) + 31536000000,
              'scopes': ['user:inference']
          }}
          with open(path, 'w') as f:
              json.dump(creds, f)
          os.chmod(path, 0o600)
          "

      - name: Install dependencies
        run: uv sync

      - name: Run GPQA Diamond eval
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          MODEL: ${{ matrix.model }}
        run: |
          uv run inspect eval inspect_evals/gpqa_diamond \
            --model "claude-code/${MODEL}" \
            --limit 50 \
            -T epochs=1 \
            -M max_connections=10 \
            -M timeout=600

      - name: Parse results
        id: parse
        run: |
          set +e
          uv run python scripts/parse_eval.py > /tmp/result.json
          EXIT_CODE=$?
          set -e
          if [ $EXIT_CODE -eq 0 ]; then
            echo "Parsed result: $(cat /tmp/result.json)"
            echo "valid=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Parse failed (exit $EXIT_CODE) — skipping result upload"
            echo "valid=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload result
        if: steps.parse.outputs.valid == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: result-${{ matrix.model }}
          path: /tmp/result.json
          retention-days: 90

  collect:
    needs: eval
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Download all results
        uses: actions/download-artifact@v4
        with:
          pattern: result-*
          path: /tmp/results

      - name: Pull latest main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main

      - name: Merge results and check for regressions
        run: uv run python scripts/merge_results.py /tmp/results

      - name: Commit results
        run: |
          git add docs/data.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "benchmark: $(date -u +%Y-%m-%d) [skip ci]"
          git push
